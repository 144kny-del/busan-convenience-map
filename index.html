</script><div class="app"><header><div class="brand">부산 <b>편의지도</b></div><div class="search"><input id="search" placeholder="카페, 화장실, 주차장 등 장소를 검색하세요"><button id="searchBtn">검색</button></div></header><main><aside><h1>내 주변, 더 편리하게</h1><p class="sub">검색어로 선택한 반경의 부산 시설을 찾아드려요.</p><button class="location" id="locate">⌖ 내 위치 정보 찾기</button><div class="status" id="status">위치를 찾은 뒤 검색어를 입력해 주세요.</div><div class="info" id="info"></div><span class="label">검색한 주변 시설</span><ul class="near-list" id="nearList"></ul><button class="more-results" id="moreResults" type="button" hidden>더보기</button></aside><section class="mapwrap"><div id="map"></div><div class="map-label">📍 부산 편의시설 지도<small id="mapNote">검색된 모든 시설을 개별 핀으로 표시합니다</small></div><div class="route"><h3 id="routeTitle">장소를 선택해 주세요</h3><p id="routeText">검색 결과의 핀을 누르면 길찾기를 이용할 수 있습니다.</p><div class="route-modes" id="routeModes"><button class="active" data-mode="walk">🚶 도보</button><button data-mode="traffic">🚌 대중교통</button><button data-mode="car">🚗 자동차</button></div><button id="routeBtn">카카오맵에서 도보 길찾기</button></div></section></main></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const places=[{n:'서면역 공중화장실',t:'toilet',i:'🚻',lat:35.1578,lng:129.0592,a:'부산진구 중앙대로 730 · 24시간'},{n:'전포 반려견 동반 카페',t:'pet',i:'🐕',lat:35.1551,lng:129.0649,a:'부산진구 전포대로 209 · 10:00–21:00'},{n:'부전 공영주차장',t:'parking',i:'🅿️',lat:35.1600,lng:129.0570,a:'부산진구 부전동 573 · 24시간'},{n:'서면역 짐 보관소',t:'luggage',i:'🧳',lat:35.1572,lng:129.0580,a:'서면역 1번 출구 · 06:00–23:00'},{n:'부산시민공원 화장실',t:'toilet',i:'🚻',lat:35.1690,lng:129.0565,a:'부산진구 시민공원로 73 · 06:00–23:00'},{n:'해운대 공영주차장',t:'parking',i:'🅿️',lat:35.1587,lng:129.1603,a:'해운대구 해운대해변로 · 24시간'}];const map=L.map('map').setView([35.1578,129.0592],14);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);let pos=null,user=null,watch=null,selected=places[0],routeLine=null;const layer=L.layerGroup().addTo(map),$=x=>document.querySelector(x);function icon(p){return L.divIcon({className:'',html:`<div class="facility-icon ${p.t}"><span>${p.i}</span></div>`,iconSize:[34,34],iconAnchor:[17,34]})}function distance(p){if(!pos)return null;return map.distance([pos.lat,pos.lng],[p.lat,p.lng])/1000}function active(){return [...document.querySelectorAll('.chip.active')].map(x=>x.dataset.type)}function draw(p){selected=p;const km=distance(p);$('#info').innerHTML=`<small>선택한 시설</small><h2>${p.i} ${p.n}</h2><p>${p.a}</p>${km!==null?`<span class="distance">${km<1?Math.round(km*1000)+'m':km.toFixed(1)+'km'} · 도보 약 ${Math.max(1,Math.round(km*12))}분</span>`:''}`;$('#routeTitle').textContent=p.n;$('#routeText').textContent=km===null?'내 위치 정보 찾기 후 거리와 경로를 확인하세요.':`내 위치에서 ${km<1?Math.round(km*1000)+'m':km.toFixed(1)+'km'} · 도보 약 ${Math.max(1,Math.round(km*12))}분`;render()}function render(){layer.clearLayers();places.filter(p=>active().includes(p.t)).forEach(p=>L.marker([p.lat,p.lng],{icon:icon(p)}).on('click',()=>draw(p)).bindTooltip(p.n,{direction:'top'}).addTo(layer));const list=places.filter(p=>active().includes(p.t)).sort((a,b)=>(distance(a)??0)-(distance(b)??0));$('#nearList').innerHTML=list.slice(0,5).map(p=>`<li><button data-name="${p.n}">${p.i} ${p.n}<b>${pos?(distance(p)<1?Math.round(distance(p)*1000)+'m':distance(p).toFixed(1)+'km'):'보기'}</b></button></li>`).join('');document.querySelectorAll('#nearList button').forEach(b=>b.onclick=()=>draw(places.find(p=>p.n===b.dataset.name)))}function locate(){if(!navigator.geolocation){$('#status').textContent='이 브라우저는 위치 기능을 지원하지 않습니다.';return}if(watch!==null&&pos){map.setView([pos.lat,pos.lng],15);return}$('#status').textContent='위치 권한을 요청하고 있어요…';watch=navigator.geolocation.watchPosition(p=>{pos={lat:p.coords.latitude,lng:p.coords.longitude};if(!user)user=L.marker([pos.lat,pos.lng],{icon:L.divIcon({className:'',html:'<div class="user-icon"></div>',iconSize:[20,20],iconAnchor:[10,10]})}).addTo(map).bindTooltip('내 현재 위치');else user.setLatLng([pos.lat,pos.lng]);$('#status').className='status ok';$('#status').textContent='● 실시간 위치 추적 중 · 정확도 약 '+Math.round(p.coords.accuracy)+'m';$('#mapNote').textContent='파란 점은 내 위치이며 지도 이동과 함께 실제 좌표에 고정됩니다';map.setView([pos.lat,pos.lng],15);const closest=places.filter(x=>active().includes(x.t)).sort((a,b)=>distance(a)-distance(b))[0];if(closest)draw(closest);else render()},()=>{$('#status').textContent='위치 권한을 허용해 주세요. 주소 표시줄의 위치 권한을 확인하세요.';watch=null},{enableHighAccuracy:true,maximumAge:5000,timeout:15000})}$('#locate').onclick=locate;$('#routeBtn').onclick=()=>{if(!pos){locate();return}if(routeLine)map.removeLayer(routeLine);routeLine=L.polyline([[pos.lat,pos.lng],[selected.lat,selected.lng]],{color:'#1769e0',weight:5,dashArray:'8 8'}).addTo(map);map.fitBounds(routeLine.getBounds(),{padding:[70,70]});$('#mapNote').textContent='파란 점선은 내 위치에서 시설까지의 직선 안내입니다'};document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{b.classList.toggle('active');render();if(pos){const p=places.filter(x=>active().includes(x.t)).sort((a,b)=>distance(a)-distance(b))[0];if(p)draw(p)}});function search(){const q=$('#search').value.trim();const p=places.find(x=>x.n.includes(q)||x.a.includes(q));if(!p){$('#status').textContent='일치하는 시설이 없습니다. 예: 서면, 해운대, 화장실';return}if(!active().includes(p.t))document.querySelector(`.chip[data-type="${p.t}"]`).classList.add('active');draw(p);map.setView([p.lat,p.lng],17);$('#mapNote').textContent='검색한 시설 위치를 표시합니다'}$('#searchBtn').onclick=search;$('#search').onkeydown=e=>{if(e.key==='Enter')search()};draw(selected);
</script><script>
// 3km 반경용 데모 시설: 동일 종류의 시설도 각각 별도 표시합니다.
places.push(
  {n:'남포동 공중화장실',t:'toilet',i:'🚻',lat:35.0977,lng:129.0304,a:'중구 구덕로 · 24시간'},
  {n:'부산역 광장 화장실',t:'toilet',i:'🚻',lat:35.1154,lng:129.0415,a:'동구 중앙대로 · 24시간'},
  {n:'중앙동 공영주차장',t:'parking',i:'🅿️',lat:35.1052,lng:129.0358,a:'중구 중앙대로 · 24시간'},
  {n:'부산역 짐 보관소',t:'luggage',i:'🧳',lat:35.1150,lng:129.0411,a:'부산역 광장 · 06:00–23:00'},
  {n:'용두산 반려견 동반 카페',t:'pet',i:'🐕',lat:35.1016,lng:129.0328,a:'중구 광복로 · 11:00–21:00'},
  {n:'자갈치 공영주차장',t:'parking',i:'🅿️',lat:35.0969,lng:129.0300,a:'중구 자갈치로 · 24시간'}
);
render = function(){
  layer.clearLayers();
  const candidates=places.filter(p=>active().includes(p.t) && (!pos || distance(p)<=3));
  candidates.forEach(p=>L.marker([p.lat,p.lng],{icon:icon(p)}).on('click',()=>draw(p)).bindTooltip(p.n,{direction:'top'}).addTo(layer));
  if(pos && candidates.length===0){
    $('#nearList').innerHTML='<li style="padding:10px 0;color:#627184;font-size:12px">3km 안에 해당 시설이 없습니다. 필터를 바꾸거나 지도를 이동해 보세요.</li>';
    return;
  }
  const list=pos?candidates.sort((a,b)=>distance(a)-distance(b)):candidates;
  $('#nearList').innerHTML=list.map(p=>`<li><button data-name="${p.n}">${p.i} ${p.n}<b>${pos?(distance(p)<1?Math.round(distance(p)*1000)+'m':distance(p).toFixed(1)+'km'):'보기'}</b></button></li>`).join('');
  document.querySelectorAll('#nearList button').forEach(b=>b.onclick=()=>draw(places.find(p=>p.n===b.dataset.name)));
  $('#mapNote').textContent=pos?'내 위치 3km 안의 시설 '+candidates.length+'곳을 표시합니다':'위치 찾기 후 3km 반경으로 표시합니다';
};
render();
</script><script>
// 일반 장소 검색용 데모 데이터: 편의시설 필터와 별도로 지도에 표시됩니다.
const placesToSearch=[
  {n:'서면역',kind:'지하철역',i:'🚇',lat:35.1579,lng:129.0592,a:'부산 도시철도 1·2호선 서면역'},
  {n:'부산역',kind:'지하철역',i:'🚇',lat:35.1152,lng:129.0417,a:'부산 도시철도 1호선 부산역'},
  {n:'남포역',kind:'지하철역',i:'🚇',lat:35.0982,lng:129.0297,a:'부산 도시철도 1호선 남포역'},
  {n:'해운대역',kind:'지하철역',i:'🚇',lat:35.1631,lng:129.1585,a:'부산 도시철도 2호선 해운대역'},
  {n:'서면역 버스정류장',kind:'버스정류장',i:'🚌',lat:35.1572,lng:129.0584,a:'부산진구 중앙대로 · 시내버스 정류장'},
  {n:'부산역 버스정류장',kind:'버스정류장',i:'🚌',lat:35.1157,lng:129.0414,a:'동구 중앙대로 · 시내버스 정류장'},
  {n:'남포동 버스정류장',kind:'버스정류장',i:'🚌',lat:35.0990,lng:129.0311,a:'중구 구덕로 · 시내버스 정류장'},
  {n:'전포 카페거리',kind:'카페',i:'☕',lat:35.1552,lng:129.0648,a:'부산진구 전포대로 · 카페 밀집 지역'},
  {n:'남포동 카페',kind:'카페',i:'☕',lat:35.1009,lng:129.0323,a:'중구 광복로 · 카페'},
  {n:'해운대 해변 카페',kind:'카페',i:'☕',lat:35.1584,lng:129.1604,a:'해운대구 해운대해변로 · 카페'}
];
const searchedLayer=L.layerGroup().addTo(map);
function selectPlaceResult(p){
  selected=p;
  const km=pos?distance(p):null;
  $('#info').innerHTML=`<small>검색 결과 · ${p.kind}</small><h2>${p.i} ${p.n}</h2><p>${p.a}</p>${km!==null?`<span class="distance">${km<1?Math.round(km*1000)+'m':km.toFixed(1)+'km'} · 내 위치 기준</span>`:''}`;
  $('#routeTitle').textContent=p.n;
  $('#routeText').textContent=km===null?'내 위치 정보 찾기 후 거리와 경로를 확인하세요.':`내 위치에서 ${km<1?Math.round(km*1000)+'m':km.toFixed(1)+'km'}`;
  searchedLayer.clearLayers();
  L.marker([p.lat,p.lng],{icon:L.divIcon({className:'',html:'<div class="facility-icon" style="background:#8b3fc7"><span>'+p.i+'</span></div>',iconSize:[34,34],iconAnchor:[17,34]})}).addTo(searchedLayer).bindTooltip(p.n,{permanent:true,direction:'top'}).openTooltip();
  map.setView([p.lat,p.lng],16);
  $('#mapNote').textContent='검색한 '+p.kind+' 위치를 보라색 핀으로 표시합니다';
}
function expandedSearch(){
  const q=$('#search').value.trim().toLowerCase();
  if(!q){$('#status').textContent='검색어를 입력해 주세요.';return}
  let candidates=[...places,...placesToSearch].filter(p=>(p.n+' '+p.a+' '+(p.kind||'')).toLowerCase().includes(q));
  if(q.includes('지하철'))candidates=placesToSearch.filter(p=>p.kind==='지하철역');
  if(q.includes('버스'))candidates=placesToSearch.filter(p=>p.kind==='버스정류장');
  if(q.includes('카페'))candidates=placesToSearch.filter(p=>p.kind==='카페');
  if(!candidates.length){$('#status').textContent='일치하는 장소가 없습니다. 예: 지하철, 버스, 카페, 서면';return}
  const p=pos?candidates.sort((a,b)=>distance(a)-distance(b))[0]:candidates[0];

function kakaoCoverageCenters(origin,radiusKm){

    },250);
  });
}
$('#routeBtn').onclick=async()=>{
  const button=$('#routeBtn');
  if(!kakaoSelectionReady||!selected||!Number.isFinite(selected.lat)||!Number.isFinite(selected.lng)){
    $('#routeText').textContent='먼저 장소를 검색하고 핀을 선택해 주세요.';return;
  }
  const destinationPlace=selected;
  const kakaoWindow=window.open('about:blank','_blank');
  button.textContent='현재 위치 확인 중…';button.disabled=true;
  try{
    await waitForCurrentPosition();
    chooseKakaoPlace(destinationPlace);
    const start=`${encodeURIComponent('내 위치')},${pos.lat},${pos.lng}`;
    const destination=`${encodeURIComponent(destinationPlace.n)},${destinationPlace.lat},${destinationPlace.lng}`;
    const kakaoRouteUrl=`https://map.kakao.com/link/by/${kakaoRouteMode}/${start}/${destination}`;
    if(kakaoWindow){kakaoWindow.opener=null;kakaoWindow.location.replace(kakaoRouteUrl)}
    else window.location.href=kakaoRouteUrl;
    const km=kakaoDistance(destinationPlace),modeName={walk:'도보',traffic:'대중교통',car:'자동차'}[kakaoRouteMode];
    $('#routeText').textContent=`카카오맵에서 ${modeName} 경로를 열었습니다 · 직선거리 ${km<1?Math.round(km*1000)+'m':km.toFixed(1)+'km'}`;
  }catch(error){
    if(kakaoWindow)kakaoWindow.close();
    $('#routeText').textContent=error.message;
    $('#status').textContent=error.message;
  }finally{button.textContent=`카카오맵에서 ${{walk:'도보',traffic:'대중교통',car:'자동차'}[kakaoRouteMode]} 길찾기`;button.disabled=false}
};
document.querySelectorAll('#routeModes button').forEach(modeButton=>modeButton.onclick=()=>{
  kakaoRouteMode=modeButton.dataset.mode;
  document.querySelectorAll('#routeModes button').forEach(item=>item.classList.toggle('active',item===modeButton));
  const modeName={walk:'도보',traffic:'대중교통',car:'자동차'}[kakaoRouteMode];
  $('#routeBtn').textContent=`카카오맵에서 ${modeName} 길찾기`;
  if(kakaoSelectionReady)$('#routeText').textContent=`${selected.n}까지 ${modeName} 경로를 확인합니다.`;
});
$('#info').innerHTML='<small>장소 검색</small><h2>검색 결과를 선택해 주세요</h2><p>위치 확인 후 카페, 화장실, 주차장처럼 원하는 시설을 검색하세요.</p>';
$('#nearList').innerHTML='<li style="padding:10px 0;color:#627184;font-size:12px">검색 결과가 여기에 표시됩니다.</li>';
</script></body></html>
